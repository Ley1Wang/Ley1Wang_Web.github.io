<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendulum Motion Lab</title>
<link rel="icon" href="../assets/nana.ico">
<style>
:root{--bg:#f3fdf8;--panel:#fff;--primary:#065f46;--accent:#10b981;--ink:#072E33;--text:#1f2937;--muted:#64748b;--line:#d1fae5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.topbar{height:56px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topbar span,.topbar a{color:#fff}.topbar a{text-decoration:none;opacity:.86}.wrap{max-width:1120px;margin:34px auto 54px;padding:0 20px}h1{margin:0 0 10px;color:var(--primary);font-size:34px}p{color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(7,46,51,.08);padding:22px}button{border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;min-height:38px;padding:0 14px;cursor:pointer}.secondary{background:#e9fbf3;color:var(--primary);border:1px solid #b8efd6}label{display:flex;justify-content:space-between;gap:12px;margin:14px 0 6px;color:var(--muted);font-size:14px}input,select,textarea{width:100%;border:1px solid #cfe7dc;border-radius:7px;padding:9px;background:#fbfffd;color:var(--text)}input[type=range]{padding:0}canvas{width:100%;aspect-ratio:16/10;display:block;border:1px solid var(--line);border-radius:10px;background:#fbfffd}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.metric div{background:#fbfffd;border:1px solid #e5f6ee;border-radius:8px;padding:12px}.metric strong{display:block;color:var(--primary);font-size:18px}.code{background:#071f22;color:#d1fae5;border-radius:8px;padding:12px;overflow:auto;font-size:13px;line-height:1.5}@media(max-width:820px){.grid,.metric{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><span>Pendulum Motion Lab</span><a href="https://wangleyi.top/pages/physics">Back</a></div>
<main class="wrap"><h1>Pendulum Motion Lab</h1><p>Adjust length, gravity, and starting angle to compare simple harmonic motion with a live pendulum trace.</p><section class="grid"><aside class="panel"><h2>Controls</h2><label><span>Length</span><strong id="lText">2.0 m</strong></label><input id="len" type="range" min="0.5" max="4" step="0.1" value="2"><label><span>Gravity</span><strong id="gText">9.8</strong></label><input id="grav" type="range" min="1.6" max="24" step="0.1" value="9.8"><label><span>Start angle</span><strong id="aText">28 deg</strong></label><input id="ang" type="range" min="5" max="65" value="28"><div class="buttons"><button id="restart">Restart</button></div><div class="metric"><div><strong id="period">0</strong><span>period</span></div><div><strong id="theta">0</strong><span>angle</span></div><div><strong id="energy">0</strong><span>energy</span></div></div></aside><section class="panel"><canvas id="canvas" width="900" height="560"></canvas></section></section></main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');let t=0,th=0,v=0,last=performance.now();function reset(){th=ang.value*Math.PI/180;v=0;t=0}function step(dt){let L=+len.value,g=+grav.value,a=-(g/L)*Math.sin(th);v+=a*dt;th+=v*dt;t+=dt}function draw(){let L=+len.value,g=+grav.value,scale=90,x0=c.width/2,y0=80,x=x0+Math.sin(th)*L*scale,y=y0+Math.cos(th)*L*scale;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fbfffd';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#d1fae5';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(x0,y0,(i+1)*55,0,Math.PI);ctx.stroke()}ctx.strokeStyle='#063b40';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle='#10b981';ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill();lText.textContent=(+len.value).toFixed(1)+' m';gText.textContent=(+grav.value).toFixed(1);aText.textContent=ang.value+' deg';period.textContent=(2*Math.PI*Math.sqrt(L/g)).toFixed(2)+' s';theta.textContent=(th*180/Math.PI).toFixed(1);energy.textContent=(.5*v*v+g/L*(1-Math.cos(th))).toFixed(2)}function loop(now){let dt=Math.min(.03,(now-last)/1000);last=now;step(dt);draw();requestAnimationFrame(loop)}restart.onclick=reset;for(let el of [len,grav,ang])el.oninput=()=>{reset();draw()};reset();requestAnimationFrame(loop);
</script>
<script data-goatcounter="https://wangleyi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
