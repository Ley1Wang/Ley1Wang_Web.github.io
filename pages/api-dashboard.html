<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Request Dashboard</title>
<link rel="icon" href="../assets/nana.ico">
<style>
:root{--bg:#f3fdf8;--panel:#fff;--primary:#065f46;--accent:#10b981;--ink:#072E33;--text:#1f2937;--muted:#64748b;--line:#d1fae5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.topbar{height:56px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topbar span,.topbar a{color:#fff}.topbar a{text-decoration:none;opacity:.86}.wrap{max-width:1120px;margin:34px auto 54px;padding:0 20px}h1{margin:0 0 10px;color:var(--primary);font-size:34px}p{color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(7,46,51,.08);padding:22px}button{border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;min-height:38px;padding:0 14px;cursor:pointer}.secondary{background:#e9fbf3;color:var(--primary);border:1px solid #b8efd6}label{display:flex;justify-content:space-between;gap:12px;margin:14px 0 6px;color:var(--muted);font-size:14px}input,select,textarea{width:100%;border:1px solid #cfe7dc;border-radius:7px;padding:9px;background:#fbfffd;color:var(--text)}input[type=range]{padding:0}canvas{width:100%;aspect-ratio:16/10;display:block;border:1px solid var(--line);border-radius:10px;background:#fbfffd}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.metric div{background:#fbfffd;border:1px solid #e5f6ee;border-radius:8px;padding:12px}.metric strong{display:block;color:var(--primary);font-size:18px}.code{background:#071f22;color:#d1fae5;border-radius:8px;padding:12px;overflow:auto;font-size:13px;line-height:1.5}@media(max-width:820px){.grid,.metric{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><span>API Request Dashboard</span><a href="cs.html">Back</a></div>
<main class="wrap"><h1>API Request Dashboard</h1><p>Practice frontend-backend thinking with a small dashboard that formats request parameters and simulated JSON responses.</p><section class="grid"><aside class="panel"><h2>Request Builder</h2><label><span>Endpoint</span></label><select id="endpoint"><option>/api/projects</option><option>/api/metrics</option><option>/api/status</option></select><label><span>Query parameter</span></label><input id="param" value="category=physics"><label><span>POST body</span></label><textarea id="body" rows="6">{"name":"radar","active":true}</textarea><div class="buttons"><button id="send">Send Request</button><button id="reset" class="secondary">Reset</button></div></aside><section class="panel"><canvas id="canvas" width="900" height="560"></canvas><pre class="code" id="output"></pre></section></section></main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');function draw(kind){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fbfffd';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#065f46';ctx.lineWidth=4;ctx.strokeRect(90,130,220,130);ctx.strokeRect(590,130,220,130);ctx.strokeRect(340,330,220,110);ctx.fillStyle='#065f46';ctx.font='700 24px Arial';ctx.fillText('React UI',148,202);ctx.fillText('Flask API',650,202);ctx.fillText('Database',394,395);ctx.strokeStyle='#10b981';ctx.lineWidth=6;arrow(315,195,585,195);arrow(700,265,515,328);arrow(380,328,200,265);ctx.fillStyle='#64748b';ctx.font='18px Arial';ctx.fillText(kind||'GET / POST',410,180)}function arrow(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();let a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-Math.cos(a-.5)*18,y2-Math.sin(a-.5)*18);ctx.moveTo(x2,y2);ctx.lineTo(x2-Math.cos(a+.5)*18,y2-Math.sin(a+.5)*18);ctx.stroke()}function respond(){let parsed;try{parsed=JSON.parse(body.value)}catch(e){parsed={error:'Invalid JSON body'}}let data={endpoint:endpoint.value,param:param.value,body:parsed,response:{ok:true,rows:Math.floor(20+Math.random()*80),latency_ms:Math.floor(40+Math.random()*120)}};output.textContent=JSON.stringify(data,null,2);draw(endpoint.value)}send.onclick=respond;reset.onclick=()=>{param.value='category=physics';body.value='{"name":"radar","active":true}';respond()};respond();
</script>
<script data-goatcounter="https://wangleyi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
