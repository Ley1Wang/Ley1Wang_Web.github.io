<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mean Confidence Interval — Leyi Wang</title><link rel="stylesheet" href="../assets/stat-lab.css"><meta name="description" content="Translate a sample summary into an interval estimate and see how confidence and sample size affect its width.">
<link rel="stylesheet" href="../assets/site.css">
<script defer src="../js/site-content.js"></script>
<script defer src="../js/site.js"></script>
<link rel="icon" href="../assets/nana.ico">
</head><body class="site-tool" data-project="confidence-interval"><header class="topbar"><strong>Statistics Project</strong><a href="stat.html">Back to Statistics</a></header><main class="container"><section class="hero"><div class="eyebrow">Statistical estimation</div><h1>Mean Confidence Interval</h1><p>Calculate and visualize a confidence interval for a population mean from a sample mean, standard deviation, and sample size.</p></section><section class="panel grid"><div><div class="field"><label>Sample mean</label><input id="mean" type="number" value="72.5" step="any"></div><div class="field"><label>Sample standard deviation</label><input id="sd" type="number" value="12" min="0" step="any"></div><div class="field"><label>Sample size</label><input id="size" type="number" value="64" min="2"></div><div class="field"><label>Confidence level</label><select id="level"><option value="1.645">90%</option><option value="1.96" selected>95%</option><option value="2.576">99%</option></select></div><button class="button" id="calculate">Calculate interval</button></div><div><div class="results"><div class="result">Lower<strong id="lower">—</strong></div><div class="result">Estimate<strong id="estimate">—</strong></div><div class="result">Upper<strong id="upper">—</strong></div></div><div class="interval"><div class="axis"></div><div class="range" id="range"></div><div class="center" id="center"></div></div><p class="muted" id="interpretation"></p></div></section></main><footer class="footer">&copy; 2026 Leyi Wang</footer><script>
function update(){
 const m=+mean.value,s=+sd.value,n=+size.value,z=+level.value;
 if(!mean.value.trim()||!sd.value.trim()||!size.value.trim()||![m,s,n].every(Number.isFinite)||s<0||!Number.isSafeInteger(n)||n<2){lower.textContent=estimate.textContent=upper.textContent='—';range.hidden=true;center.hidden=true;interpretation.textContent='Enter a finite mean, a nonnegative standard deviation, and a whole-number sample size of at least 2.';return;}
 const margin=z*s/Math.sqrt(n),lo=m-margin,hi=m+margin;
 lower.textContent=lo.toFixed(3);estimate.textContent=m.toFixed(3);upper.textContent=hi.toFixed(3);
 const span=Math.max(s,Math.abs(m)*.05,margin*1.2,1),halfWidth=47*margin/span;
 range.hidden=false;center.hidden=false;range.style.left=(50-halfWidth)+'%';range.style.width=(halfWidth*2)+'%';center.style.left='50%';
 interpretation.textContent=`Normal approximation: ${m.toFixed(2)} ± ${margin.toFixed(2)}, giving (${lo.toFixed(2)}, ${hi.toFixed(2)}). Display axis: ${(m-span).toFixed(2)} to ${(m+span).toFixed(2)}.`;
}
calculate.addEventListener('click',update);update();
</script></body></html>
