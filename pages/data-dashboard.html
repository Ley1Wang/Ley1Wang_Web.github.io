<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Dashboard</title>
<link rel="icon" href="../assets/nana.ico">
<script src="../chart.js"></script>
<style>
:root {
    --bg: #f3fdf8;
    --card: #ffffff;
    --primary: #065f46;
    --dark: #072E33;
    --accent: #10b981;
    --text: #1f2937;
    --subtext: #6b7280;
    --border: #d1d5db;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
.topbar { height: 60px; background: var(--dark); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; }
.topbar .title, .topbar a { color: white; text-decoration: none; }
.container { max-width: 1080px; margin: 54px auto; padding: 0 24px; }
h1 { color: var(--primary); margin: 0 0 10px; font-size: 34px; }
.lead { color: var(--subtext); margin: 0 0 26px; line-height: 1.6; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 22px; }
.card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 20px; box-shadow: 0 10px 24px rgba(0,0,0,0.06); }
.metric { color: var(--primary); font-size: 30px; font-weight: 800; margin-top: 8px; }
.chart-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 18px; }
canvas { width: 100%; max-height: 360px; }
.table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.table th, .table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
.table th { color: var(--primary); }
@media (max-width: 820px) { .grid, .chart-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="topbar">
    <div class="title">Data Dashboard</div>
    <a href="../index.html">Home</a>
</div>

<div class="container">
    <h1>Data Dashboard</h1>
    <p class="lead">A compact dashboard for practicing statistical summaries, chart layout, and project-style reporting.</p>

    <div class="grid">
        <div class="card"><strong>Samples</strong><div class="metric">42</div></div>
        <div class="card"><strong>Mean Score</strong><div class="metric">86.4</div></div>
        <div class="card"><strong>Highest Score</strong><div class="metric">98</div></div>
    </div>

    <div class="chart-grid">
        <div class="card"><canvas id="lineChart"></canvas></div>
        <div class="card"><canvas id="barChart"></canvas></div>
    </div>

    <div class="card" style="margin-top:18px;">
        <strong>Recent Data Sets</strong>
        <table class="table">
            <thead><tr><th>Name</th><th>Type</th><th>Records</th></tr></thead>
            <tbody>
                <tr><td>Experiment A</td><td>Physics</td><td>12</td></tr>
                <tr><td>Survey B</td><td>Statistics</td><td>18</td></tr>
                <tr><td>API Log C</td><td>Computer Science</td><td>12</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script data-goatcounter="https://wangleyi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];
new Chart(document.getElementById("lineChart"), {
    type: "line",
    data: { labels: months, datasets: [{ label: "Project score", data: [72, 78, 81, 85, 88, 92], borderColor: "#10b981", backgroundColor: "rgba(16,185,129,0.15)", tension: 0.35, fill: true }] },
    options: { responsive: true, plugins: { legend: { display: false } } }
});
new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: { labels: ["Phy", "Stat", "CS"], datasets: [{ label: "Records", data: [12, 18, 12], backgroundColor: ["#10b981", "#065f46", "#6ee7b7"] }] },
    options: { responsive: true, plugins: { legend: { display: false } } }
});
</script>
</body>
</html>
