<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Algorithm Visualizer</title>
<link rel="icon" href="../assets/nana.ico">
<style>
:root{--bg:#f3fdf8;--panel:#fff;--primary:#065f46;--accent:#10b981;--ink:#072E33;--text:#1f2937;--muted:#64748b;--line:#d1fae5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.topbar{height:56px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topbar span,.topbar a{color:#fff}.topbar a{text-decoration:none;opacity:.86}.wrap{max-width:1120px;margin:34px auto 54px;padding:0 20px}h1{margin:0 0 10px;color:var(--primary);font-size:34px}p{color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(7,46,51,.08);padding:22px}button{border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;min-height:38px;padding:0 14px;cursor:pointer}.secondary{background:#e9fbf3;color:var(--primary);border:1px solid #b8efd6}label{display:flex;justify-content:space-between;gap:12px;margin:14px 0 6px;color:var(--muted);font-size:14px}input,select,textarea{width:100%;border:1px solid #cfe7dc;border-radius:7px;padding:9px;background:#fbfffd;color:var(--text)}input[type=range]{padding:0}canvas{width:100%;aspect-ratio:16/10;display:block;border:1px solid var(--line);border-radius:10px;background:#fbfffd}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.metric div{background:#fbfffd;border:1px solid #e5f6ee;border-radius:8px;padding:12px}.metric strong{display:block;color:var(--primary);font-size:18px}.code{background:#071f22;color:#d1fae5;border-radius:8px;padding:12px;overflow:auto;font-size:13px;line-height:1.5}@media(max-width:820px){.grid,.metric{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><span>Sorting Algorithm Visualizer</span><a href="https://wangleyi.top/pages/cs">Back</a></div>
<main class="wrap">
<h1>Sorting Algorithm Visualizer</h1>
<p>Compare how bubble sort, selection sort, and insertion sort move through the same data set step by step.</p>
<section class="grid"><aside class="panel"><h2>Controls</h2><label><span>Algorithm</span></label><select id="algo"><option>Bubble Sort</option><option>Selection Sort</option><option>Insertion Sort</option></select><label><span>Array size</span><strong id="sizeText">36</strong></label><input id="size" type="range" min="16" max="64" value="36"><label><span>Speed</span><strong id="speedText">45 ms</strong></label><input id="speed" type="range" min="15" max="160" value="45"><div class="buttons"><button id="start">Start</button><button id="shuffle" class="secondary">Shuffle</button></div><div class="metric"><div><strong id="comp">0</strong><span>comparisons</span></div><div><strong id="swap">0</strong><span>moves</span></div><div><strong id="state">Ready</strong><span>state</span></div></div></aside><section class="panel"><canvas id="canvas" width="900" height="560"></canvas></section></section>
</main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');let arr=[],run=false,comp=0,sw=0,mark=[];function make(){arr=Array.from({length:+size.value},()=>10+Math.random()*90);comp=0;sw=0;mark=[];draw();update()}function update(){sizeText.textContent=size.value;speedText.textContent=speed.value+' ms';document.getElementById('comp').textContent=comp;document.getElementById('swap').textContent=sw}function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fbfffd';ctx.fillRect(0,0,c.width,c.height);let w=c.width/arr.length;arr.forEach((v,i)=>{ctx.fillStyle=mark.includes(i)?'#10b981':'#065f46';ctx.fillRect(i*w+2,c.height-v/100*(c.height-34),Math.max(2,w-4),v/100*(c.height-34));})}const wait=()=>new Promise(r=>setTimeout(r,+speed.value));async function bubble(){for(let i=0;i<arr.length;i++)for(let j=0;j<arr.length-i-1;j++){mark=[j,j+1];comp++;if(arr[j]>arr[j+1]){[arr[j],arr[j+1]]=[arr[j+1],arr[j]];sw++}update();draw();await wait()}}async function selection(){for(let i=0;i<arr.length;i++){let m=i;for(let j=i+1;j<arr.length;j++){mark=[m,j];comp++;if(arr[j]<arr[m])m=j;update();draw();await wait()}[arr[i],arr[m]]=[arr[m],arr[i]];sw++}}async function insertion(){for(let i=1;i<arr.length;i++){let key=arr[i],j=i-1;while(j>=0&&arr[j]>key){mark=[j,j+1];comp++;arr[j+1]=arr[j];j--;sw++;update();draw();await wait()}arr[j+1]=key}}start.onclick=async()=>{if(run)return;run=true;state.textContent='Running';if(algo.value==='Bubble Sort')await bubble();if(algo.value==='Selection Sort')await selection();if(algo.value==='Insertion Sort')await insertion();mark=[];draw();state.textContent='Sorted';run=false};shuffle.onclick=make;size.oninput=make;speed.oninput=update;make();
</script>
<script data-goatcounter="https://wangleyi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
