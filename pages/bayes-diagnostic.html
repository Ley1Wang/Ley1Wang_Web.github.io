<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayes Rule Diagnostic Calculator</title>
<link rel="icon" href="../assets/nana.ico">
<style>
:root{--bg:#f3fdf8;--panel:#fff;--primary:#065f46;--accent:#10b981;--ink:#072E33;--text:#1f2937;--muted:#64748b;--line:#d1fae5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.topbar{height:56px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topbar span,.topbar a{color:#fff}.topbar a{text-decoration:none;opacity:.86}.wrap{max-width:1120px;margin:34px auto 54px;padding:0 20px}h1{margin:0 0 10px;color:var(--primary);font-size:34px}p{color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(7,46,51,.08);padding:22px}button{border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;min-height:38px;padding:0 14px;cursor:pointer}.secondary{background:#e9fbf3;color:var(--primary);border:1px solid #b8efd6}label{display:flex;justify-content:space-between;gap:12px;margin:14px 0 6px;color:var(--muted);font-size:14px}input,select,textarea{width:100%;border:1px solid #cfe7dc;border-radius:7px;padding:9px;background:#fbfffd;color:var(--text)}input[type=range]{padding:0}canvas{width:100%;aspect-ratio:16/10;display:block;border:1px solid var(--line);border-radius:10px;background:#fbfffd}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.metric div{background:#fbfffd;border:1px solid #e5f6ee;border-radius:8px;padding:12px}.metric strong{display:block;color:var(--primary);font-size:18px}.code{background:#071f22;color:#d1fae5;border-radius:8px;padding:12px;overflow:auto;font-size:13px;line-height:1.5}@media(max-width:820px){.grid,.metric{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><span>Bayes Rule Diagnostic Calculator</span><a href="https://wangleyi.top/pages/stat">Back</a></div>
<main class="wrap"><h1>Bayes Rule Diagnostic Calculator</h1><p>Explore how prevalence, sensitivity, and specificity determine the probability of a true condition after a positive test.</p><section class="grid"><aside class="panel"><h2>Inputs</h2><label><span>Prevalence</span><strong id="prevText">5%</strong></label><input id="prev" type="range" min="1" max="80" value="5"><label><span>Sensitivity</span><strong id="sensText">90%</strong></label><input id="sens" type="range" min="50" max="99" value="90"><label><span>Specificity</span><strong id="specText">95%</strong></label><input id="spec" type="range" min="50" max="99" value="95"><div class="metric"><div><strong id="ppv">0%</strong><span>P(condition | +)</span></div><div><strong id="fp">0</strong><span>false positives</span></div><div><strong id="tp">0</strong><span>true positives</span></div></div></aside><section class="panel"><canvas id="canvas" width="900" height="560"></canvas></section></section></main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');function calc(){let p=prev.value/100,se=sens.value/100,sp=spec.value/100,N=1000,tp=N*p*se,fn=N*p*(1-se),fpv=N*(1-p)*(1-sp),tn=N*(1-p)*sp,prob=tp/(tp+fpv);prevText.textContent=prev.value+'%';sensText.textContent=sens.value+'%';specText.textContent=spec.value+'%';ppv.textContent=(prob*100).toFixed(1)+'%';fp.textContent=Math.round(fpv);document.getElementById('tp').textContent=Math.round(tp);draw(tp,fpv,tn,fn)}function draw(tp,fp,tn,fn){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fbfffd';ctx.fillRect(0,0,c.width,c.height);let vals=[tp,fp,tn,fn],labs=['True +','False +','True -','False -'],cols=['#10b981','#dc2626','#065f46','#f59e0b'],max=Math.max(...vals);vals.forEach((v,i)=>{let x=110+i*185,h=v/max*330;ctx.fillStyle=cols[i];ctx.fillRect(x,430-h,100,h);ctx.fillStyle='#1f2937';ctx.font='18px Arial';ctx.fillText(labs[i],x,462);ctx.fillText(Math.round(v),x+18,410-h)})}for(let el of [prev,sens,spec])el.oninput=calc;calc();
</script>
<script data-goatcounter="https://wangleyi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
