<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Add measured pairs, inspect a scatter plot, and compare a least-squares line with the observations.">
  <title>Scatter Plot &amp; Regression — Leyi Wang</title>
  <link rel="icon" href="../assets/physics.ico">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../chart.js"></script>
  <script defer src="../js/site-content.js"></script>
  <script defer src="../js/site.js"></script>
</head>
<body class="site-tool" data-project="Plot">
  <div class="topbar"><a href="physics.html">Physics projects</a></div>
  <main class="container">
    <h1>Scatter Plot &amp; Regression</h1>
    <p>Add measured pairs, fit a straight line, and inspect what changes when an observation moves away from the trend.</p>
    <section class="legacy-workbench">
      <div class="legacy-fields">
        <div class="legacy-field"><label for="x">Independent variable · x</label><input id="x" type="number" step="any" placeholder="e.g. elapsed time"></div>
        <div class="legacy-field"><label for="y">Response variable · y</label><input id="y" type="number" step="any" placeholder="e.g. displacement"></div>
        <div class="legacy-actions"><button type="button" onclick="addData()">Add Point</button><button type="button" class="secondary" onclick="loadSample()">Load example</button><button type="button" class="secondary" onclick="resetData()">Clear</button></div>
      </div>
      <div id="plotError" class="field-feedback" role="alert"></div>
      <div class="legacy-results"><span>Observations: <strong id="count">0</strong></span><p id="fitResult" aria-live="polite">Add at least two points with distinct x values to fit a line.</p></div>
      <div style="height:390px;position:relative"><canvas id="myChart" aria-label="Scatter plot with a least-squares fitted line"></canvas></div>
    </section>
  </main>
  <script src="../js/Plot.js"></script>
  <script data-goatcounter="https://wangleyi.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
