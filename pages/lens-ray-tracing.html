<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lens Ray Tracing Simulator</title>
<link rel="icon" href="../assets/nana.ico">
<style>
:root{--bg:#f3fdf8;--panel:#fff;--primary:#065f46;--accent:#10b981;--ink:#072E33;--text:#1f2937;--muted:#64748b;--line:#d1fae5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.topbar{height:56px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topbar span,.topbar a{color:#fff}.topbar a{text-decoration:none;opacity:.86}.wrap{max-width:1120px;margin:34px auto 54px;padding:0 20px}h1{margin:0 0 10px;color:var(--primary);font-size:34px}p{color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(7,46,51,.08);padding:22px}button{border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;min-height:38px;padding:0 14px;cursor:pointer}.secondary{background:#e9fbf3;color:var(--primary);border:1px solid #b8efd6}label{display:flex;justify-content:space-between;gap:12px;margin:14px 0 6px;color:var(--muted);font-size:14px}input,select,textarea{width:100%;border:1px solid #cfe7dc;border-radius:7px;padding:9px;background:#fbfffd;color:var(--text)}input[type=range]{padding:0}canvas{width:100%;aspect-ratio:16/10;display:block;border:1px solid var(--line);border-radius:10px;background:#fbfffd}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.metric div{background:#fbfffd;border:1px solid #e5f6ee;border-radius:8px;padding:12px}.metric strong{display:block;color:var(--primary);font-size:18px}.code{background:#071f22;color:#d1fae5;border-radius:8px;padding:12px;overflow:auto;font-size:13px;line-height:1.5}@media(max-width:820px){.grid,.metric{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><span>Lens Ray Tracing Simulator</span><a href="https://wangleyi.top/pages/physics">Back</a></div>
<main class="wrap"><h1>Lens Ray Tracing Simulator</h1><p>Move an object and change focal length to trace principal rays through a thin convex lens.</p><section class="grid"><aside class="panel"><h2>Controls</h2><label><span>Object distance</span><strong id="dText">220 px</strong></label><input id="dist" type="range" min="90" max="360" value="220"><label><span>Object height</span><strong id="hText">90 px</strong></label><input id="height" type="range" min="40" max="150" value="90"><label><span>Focal length</span><strong id="fText">120 px</strong></label><input id="focal" type="range" min="70" max="190" value="120"><div class="metric"><div><strong id="imageD">0</strong><span>image distance</span></div><div><strong id="mag">0</strong><span>magnification</span></div><div><strong id="type">Real</strong><span>image type</span></div></div></aside><section class="panel"><canvas id="canvas" width="900" height="560"></canvas></section></section></main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');function draw(){let cx=c.width/2,cy=c.height/2,do_=+dist.value,ho=+height.value,f=+focal.value,di=1/(1/f-1/do_),m=-di/do_,hi=m*ho,ox=cx-do_,ix=cx+di;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fbfffd';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#063b40';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(45,cy);ctx.lineTo(c.width-45,cy);ctx.stroke();ctx.strokeStyle='#10b981';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx,80);ctx.quadraticCurveTo(cx+30,cy,cx,480);ctx.moveTo(cx,80);ctx.quadraticCurveTo(cx-30,cy,cx,480);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='16px Arial';ctx.fillText('F',cx+f-8,cy+24);ctx.fillText('F',cx-f-8,cy+24);arrow(ox,cy,ox,cy-ho,'#dc2626');if(isFinite(di)){arrow(ix,cy,ix,cy-hi,'#2563eb');ray(ox,cy-ho,cx,cy-ho,c.width-60,cy-ho-(c.width-60-cx)*ho/f);ray(ox,cy-ho,cx,cy,c.width-60,cy+(c.width-60-cx)*(cy-(cy-ho))/(cx-ox));ray(ox,cy-ho,cx,cy-ho+(cx-ox)*ho/f,c.width-60,cy-ho+(cx-ox)*ho/f)}dText.textContent=do_+' px';hText.textContent=ho+' px';fText.textContent=f+' px';imageD.textContent=isFinite(di)?di.toFixed(1):'inf';mag.textContent=isFinite(m)?m.toFixed(2):'inf';type.textContent=di>0?'Real':'Virtual'}function ray(x1,y1,x2,y2,x3,y3){ctx.strokeStyle='rgba(16,185,129,.72)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.stroke()}function arrow(x1,y1,x2,y2,col){ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.arc(x2,y2,7,0,Math.PI*2);ctx.fill()}for(let el of [dist,height,focal])el.oninput=draw;draw();
</script>

</body>
</html>
