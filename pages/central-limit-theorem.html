<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Limit Theorem Simulator</title><link rel="stylesheet" href="../assets/stat-lab.css"></head><body><header class="topbar"><strong>Statistics Project</strong><a href="stat.html">Back to Statistics</a></header><main class="container"><section class="hero"><div class="eyebrow">Sampling distributions</div><h1>Central Limit Theorem Simulator</h1><p>Draw repeated samples from a non-normal population and watch the distribution of sample means become approximately normal as sample size increases.</p></section><section class="panel grid"><div><div class="field"><label for="population">Population</label><select id="population"><option value="uniform">Uniform</option><option value="exponential">Right-skewed exponential</option><option value="bernoulli">Bernoulli (p = 0.3)</option></select></div><div class="field"><label for="sampleSize">Sample size</label><input id="sampleSize" type="number" min="1" max="200" value="5"></div><div class="field"><label for="samples">Number of samples</label><input id="samples" type="number" min="100" max="20000" value="2000"></div><button class="button" id="simulate">Run simulation</button><p class="muted" id="summary"></p></div><div><canvas id="histogram" width="600" height="360"></canvas></div></section></main><footer class="footer">&copy; 2026 Leyi Wang</footer><script>
const canvas=document.getElementById('histogram'),ctx=canvas.getContext('2d');function draw(){const type=population.value,n=Math.max(1,+sampleSize.value),count=Math.max(100,+samples.value),means=[];for(let i=0;i<count;i++){let sum=0;for(let j=0;j<n;j++){const u=Math.random();sum+=type==='uniform'?u:type==='exponential'?-Math.log(1-u):(u<.3?1:0)}means.push(sum/n)}const min=Math.min(...means),max=Math.max(...means),bins=30,freq=Array(bins).fill(0);means.forEach(v=>freq[Math.min(bins-1,Math.floor((v-min)/(max-min||1)*bins))]++);ctx.clearRect(0,0,600,360);ctx.fillStyle='#fbfffd';ctx.fillRect(0,0,600,360);const peak=Math.max(...freq);freq.forEach((v,i)=>{const h=v/peak*285;ctx.fillStyle='#10b981';ctx.fillRect(45+i*17,325-h,14,h)});ctx.fillStyle='#065f46';ctx.font='14px Arial';ctx.fillText(min.toFixed(2),40,347);ctx.fillText(max.toFixed(2),535,347);const mean=means.reduce((a,b)=>a+b,0)/count,sd=Math.sqrt(means.reduce((a,b)=>a+(b-mean)**2,0)/(count-1));summary.textContent=`Mean of sample means: ${mean.toFixed(4)} · Standard error: ${sd.toFixed(4)}`};simulate.addEventListener('click',draw);draw();
</script></body></html>
