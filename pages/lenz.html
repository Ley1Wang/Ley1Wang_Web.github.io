<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore a moving magnet and a simplified induction relationship, with explicit assumptions and a fixed-load demonstration.">
  <title>Induction Sketch — Leyi Wang</title>
  <link rel="icon" href="../assets/lenz.ico">
  <link rel="stylesheet" href="../assets/site.css">
  <script defer src="../js/site-content.js"></script>
  <script defer src="../js/site.js"></script>
  <style>
    .scene{position:relative;perspective:800px}.wrapper{position:relative;width:100%;height:100%;transform-style:preserve-3d}
    #coil-back,#coil-front{position:absolute;width:130px;height:130px;border:7px solid #6c7468;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%) rotateY(65deg)}
    #coil-back{z-index:1}#coil-front{z-index:3;clip-path:inset(0 0 0 50%)}
    #magnet{position:absolute;left:0;top:50%;transform:translateY(-50%);width:80px;height:48px;border-radius:5px;background:linear-gradient(to right,#c46759 0 49%,#577b99 50% 100%);z-index:2;box-shadow:0 5px 12px #26382d22}
    #magnet::before,#magnet::after{position:absolute;top:15px;color:#fff;font:12px Arial,sans-serif}#magnet::before{content:'N';left:15px}#magnet::after{content:'S';right:15px}
    .induction-caption{text-align:center;color:#839078;font-size:11px;margin:14px 0 0}
  </style>
</head>
<body class="site-tool" data-project="lenz">
  <div class="topbar"><a href="physics.html">Physics projects</a></div>
  <main class="container">
    <h1>Induction Sketch</h1>
    <p>Explore the direction of relative motion and a deliberately simplified induction relationship.</p>
    <section class="legacy-workbench">
      <div class="legacy-fields">
        <div class="legacy-field"><label for="B">Magnetic field · B</label><input id="B" type="number" min="0" step="any" value="0.5" inputmode="decimal"></div>
        <div class="legacy-field"><label for="v">Speed parameter · v</label><input id="v" type="number" min="0" step="any" value="1.2" inputmode="decimal"></div>
        <div class="legacy-field"><label for="N">Coil turns · N</label><input id="N" type="number" min="1" step="1" value="20" inputmode="numeric"></div>
        <button type="button" onclick="calc()">Calculate</button>
      </div>
      <div id="lenzError" class="field-feedback" role="alert"></div>
      <div class="legacy-results" aria-live="polite"><p id="emf">Model EMF: —</p><p id="current">Fixed-load current: —</p></div>
      <div class="scene" role="img" aria-label="Illustrative magnet passing through a coil"><div class="wrapper"><div id="coil-back"></div><div id="magnet"></div><div id="coil-front"></div></div></div>
      <p class="induction-caption">Illustrative motion · B × v × N model · fixed 5 Ω load</p>
    </section>
  </main>
  <script src="../js/lenz.js"></script>
  <script data-goatcounter="https://wangleyi.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
