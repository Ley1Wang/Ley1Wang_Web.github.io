<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap Sampling Simulator</title>
<link rel="icon" href="../assets/nana.ico">
<style>
:root{--bg:#f3fdf8;--panel:#fff;--primary:#065f46;--accent:#10b981;--ink:#072E33;--text:#1f2937;--muted:#64748b;--line:#d1fae5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.topbar{height:56px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topbar span,.topbar a{color:#fff}.topbar a{text-decoration:none;opacity:.86}.wrap{max-width:1120px;margin:34px auto 54px;padding:0 20px}h1{margin:0 0 10px;color:var(--primary);font-size:34px}p{color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(7,46,51,.08);padding:22px}button{border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;min-height:38px;padding:0 14px;cursor:pointer}.secondary{background:#e9fbf3;color:var(--primary);border:1px solid #b8efd6}label{display:flex;justify-content:space-between;gap:12px;margin:14px 0 6px;color:var(--muted);font-size:14px}input,select,textarea{width:100%;border:1px solid #cfe7dc;border-radius:7px;padding:9px;background:#fbfffd;color:var(--text)}input[type=range]{padding:0}canvas{width:100%;aspect-ratio:16/10;display:block;border:1px solid var(--line);border-radius:10px;background:#fbfffd}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.metric div{background:#fbfffd;border:1px solid #e5f6ee;border-radius:8px;padding:12px}.metric strong{display:block;color:var(--primary);font-size:18px}.code{background:#071f22;color:#d1fae5;border-radius:8px;padding:12px;overflow:auto;font-size:13px;line-height:1.5}@media(max-width:820px){.grid,.metric{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><span>Bootstrap Sampling Simulator</span><a href="stat.html">Back</a></div>
<main class="wrap"><h1>Bootstrap Sampling Simulator</h1><p>Generate a bootstrap distribution for a sample mean and see how the confidence interval changes with resampling.</p><section class="grid"><aside class="panel"><h2>Controls</h2><label><span>Sample data</span></label><textarea id="data" rows="5">12, 14, 15, 19, 21, 22, 24, 27, 28, 31</textarea><label><span>Resamples</span><strong id="nText">600</strong></label><input id="n" type="range" min="100" max="2000" step="100" value="600"><div class="buttons"><button id="run">Run Bootstrap</button></div><div class="metric"><div><strong id="mean">0</strong><span>sample mean</span></div><div><strong id="low">0</strong><span>2.5%</span></div><div><strong id="high">0</strong><span>97.5%</span></div></div></aside><section class="panel"><canvas id="canvas" width="900" height="560"></canvas></section></section></main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');function nums(){return data.value.split(/[,\s]+/).map(Number).filter(Number.isFinite)}function draw(vals){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fbfffd';ctx.fillRect(0,0,c.width,c.height);if(!vals.length)return;let min=Math.min(...vals),max=Math.max(...vals),bins=28,count=Array(bins).fill(0);vals.forEach(v=>{let i=Math.min(bins-1,Math.floor((v-min)/(max-min+1e-9)*bins));count[i]++});let m=Math.max(...count);ctx.fillStyle='#10b981';count.forEach((v,i)=>{let x=60+i*(c.width-120)/bins,h=v/m*(c.height-110);ctx.fillRect(x,c.height-60-h,(c.width-120)/bins-4,h)});ctx.strokeStyle='#063b40';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(50,c.height-60);ctx.lineTo(c.width-40,c.height-60);ctx.stroke()}function runBoot(){let a=nums(),res=[];for(let r=0;r<+n.value;r++){let s=0;for(let i=0;i<a.length;i++)s+=a[Math.floor(Math.random()*a.length)];res.push(s/a.length)}res.sort((x,y)=>x-y);mean.textContent=(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2);low.textContent=res[Math.floor(.025*res.length)].toFixed(2);high.textContent=res[Math.floor(.975*res.length)].toFixed(2);nText.textContent=n.value;draw(res)}run.onclick=runBoot;n.oninput=()=>{nText.textContent=n.value};runBoot();
</script>
<script data-goatcounter="https://wangleyi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
